<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wavely Admin - Upload Music</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Figtree', sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #1ed760; margin-bottom: 8px; }
    .subtitle { color: #b3b3b3; margin-bottom: 32px; }
    .card { background: #121212; padding: 24px; border-radius: 8px; margin-bottom: 20px; }
    h2 { margin-top: 0; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input, select { width: 100%; padding: 12px; background: #242424; border: 1px solid #333; color: #fff; border-radius: 4px; font-family: inherit; margin-bottom: 16px; font-size: 14px; }
    input[type="file"] { padding: 8px; }
    button { background: #1ed760; color: #000; border: none; padding: 12px 32px; border-radius: 50px; font-weight: 700; cursor: pointer; font-size: 14px; }
    button:hover { background: #3be477; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .artist-select { position: relative; margin-bottom: 16px; }
    .artist-select-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #242424; border: 1px solid #333; color: #fff; border-radius: 4px; padding: 12px; font-family: inherit; font-size: 14px; font-weight: 400; text-align: left; cursor: pointer; }
    .artist-select-toggle:hover { border-color: #444; }
    .artist-select-toggle .muted { color: #8f8f8f; }
    .artist-select-toggle .chev { color: #8f8f8f; }
    .artist-select-panel { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 10px; box-shadow: 0 12px 30px rgba(0,0,0,.55); }
    .artist-select-panel[hidden] { display: none; }
    .artist-select-panel input[type="search"] { margin-bottom: 8px; }
    .artists-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px; max-height: 200px; overflow-y: auto; }
    .artist-option { display: flex; align-items: center; gap: 10px; margin: 0; padding: 6px 8px; border-radius: 6px; font-weight: 500; cursor: pointer; }
    .artist-option:hover { background: #242424; }
    .artist-option input { width: auto; margin: 0; padding: 0; }
    .artist-thumb { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex: 0 0 auto; background: #2a2a2a; }
    .artist-thumb.placeholder { display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: #1ed760; }
    .hint { color: #8f8f8f; font-size: 12px; font-weight: 400; margin: -8px 0 16px; }
    #status { margin-top: 16px; padding: 12px 16px; border-radius: 4px; display: none; }
    .success { background: #1db95433; color: #1ed760; display: block !important; }
    .error { background: #ff000033; color: #ff6b6b; display: block !important; }
    .back-link { color: #b3b3b3; text-decoration: none; display: inline-block; margin-bottom: 24px; }
    .back-link:hover { color: #fff; }
    @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">← Back to Wavely</a>
    <h1>Wavely Admin Panel</h1>
    <p class="subtitle">Upload music to your Supabase database</p>

    <div class="card">
      <h2>Add New Track</h2>
      <form id="uploadForm">
        <label>Song Title *</label>
        <input type="text" id="title" placeholder="Enter song title" required>

        <label>Artists * <span class="hint">(ek ya zyada chuno)</span></label>
        <div class="artist-select" id="artistSelect">
          <button type="button" class="artist-select-toggle" id="artistToggle" aria-expanded="false" aria-haspopup="listbox">
            <span id="artistToggleLabel" class="muted">Select artists…</span>
            <span class="chev">▾</span>
          </button>
          <div class="artist-select-panel" id="artistPanel" hidden>
            <input type="search" id="artistSearch" placeholder="Search artists…" autocomplete="off">
            <div id="artistPicker" class="artists-picker" role="listbox" aria-multiselectable="true">
              <p class="hint">Loading artists…</p>
            </div>
          </div>
        </div>

        <div class="row">
          <div>
            <label>New artist name (optional)</label>
            <input type="text" id="newArtistName" placeholder="e.g. Kumar Sanu">
          </div>
          <div>
            <label>Artist photo (optional)</label>
            <input type="file" id="artistImage" accept="image/*">
          </div>
        </div>
        <p class="hint">Photo naye artist par lagti hai. Agar naya naam khaali ho aur sirf ek existing artist select ho, to us artist ki photo update hoti hai.</p>

        <label>Album</label>
        <input type="text" id="albumName" placeholder="Enter album name (leave empty for single)">

        <div class="row">
          <div>
            <label>Duration (seconds) *</label>
            <input type="number" id="duration" placeholder="e.g. 210" required>
          </div>
          <div>
            <label>Explicit</label>
            <select id="explicit">
              <option value="false">No</option>
              <option value="true">Yes</option>
            </select>
          </div>
        </div>

        <label>Audio File (MP3, M4A, OGG, WAV) *</label>
        <input type="file" id="audioFile" accept="audio/*" required>

        <label>Cover Art (JPG, PNG, WebP) - Optional</label>
        <input type="file" id="coverFile" accept="image/*">

        <button type="submit" id="submitBtn">Upload Track</button>
      </form>
      <div id="status"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/admin-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
