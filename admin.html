<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wavely Admin - Upload Music</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Figtree', sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #1ed760; margin-bottom: 8px; }
    .subtitle { color: #b3b3b3; margin-bottom: 32px; }
    .card { background: #121212; padding: 24px; border-radius: 8px; margin-bottom: 20px; }
    h2 { margin-top: 0; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input, select { width: 100%; padding: 12px; background: #242424; border: 1px solid #333; color: #fff; border-radius: 4px; font-family: inherit; margin-bottom: 16px; font-size: 14px; }
    input[type="file"] { padding: 8px; }
    button { background: #1ed760; color: #000; border: none; padding: 12px 32px; border-radius: 50px; font-weight: 700; cursor: pointer; font-size: 14px; }
    button:hover { background: #3be477; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    #status { margin-top: 16px; padding: 12px 16px; border-radius: 4px; display: none; }
    .success { background: #1db95433; color: #1ed760; display: block !important; }
    .error { background: #ff000033; color: #ff6b6b; display: block !important; }
    .back-link { color: #b3b3b3; text-decoration: none; display: inline-block; margin-bottom: 24px; }
    .back-link:hover { color: #fff; }
    @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">← Back to Wavely</a>
    <h1>Wavely Admin Panel</h1>
    <p class="subtitle">Upload music to your Supabase database</p>

    <div class="card">
      <h2>Add New Track</h2>
      <form id="uploadForm">
        <label>Song Title *</label>
        <input type="text" id="title" placeholder="Enter song title" required>

        <div class="row">
          <div>
            <label>Artist *</label>
            <input type="text" id="artistName" placeholder="Enter artist name" required>
          </div>
          <div>
            <label>Album</label>
            <input type="text" id="albumName" placeholder="Enter album name (leave empty for single)">
          </div>
        </div>

        <div class="row">
          <div>
            <label>Duration (seconds) *</label>
            <input type="number" id="duration" placeholder="e.g. 210" required>
          </div>
          <div>
            <label>Explicit</label>
            <select id="explicit">
              <option value="false">No</option>
              <option value="true">Yes</option>
            </select>
          </div>
        </div>

        <label>Audio File (MP3, M4A, OGG, WAV) *</label>
        <input type="file" id="audioFile" accept="audio/*" required>

        <label>Cover Art (JPG, PNG, WebP) - Optional</label>
        <input type="file" id="coverFile" accept="image/*">

        <button type="submit" id="submitBtn">Upload Track</button>
      </form>
      <div id="status"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/admin-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
