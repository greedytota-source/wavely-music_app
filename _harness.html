<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>harness</title>
<style>body{margin:0;background:#333;color:#eee;font:12px/1.4 monospace}iframe{display:block;border:0}#out{white-space:pre-wrap;padding:12px}</style>
</head><body>
<!-- Shell probe: loads the player in iframes at several viewport widths and
     reports what is actually laid out — computed style, geometry, grid
     templates and anything overflowing the viewport. Results land in #out as
     JSON so a headless Chrome --dump-dom run can read them. -->
<script>
const CASES = [
  { w: 1440, h: 900, route: "/" },
  { w: 1440, h: 900, route: "/library" },
  { w: 1280, h: 860, route: "/" },
  { w: 1024, h: 800, route: "/" },
  { w: 900,  h: 780, route: "/" },
  { w: 816,  h: 755, route: "/" },
  { w: 390,  h: 844, route: "/" },
  { w: 390,  h: 844, route: "/privacy" }
];
window.__results = null;
let done = 0;
const out = [];
CASES.forEach((c, idx) => {
  const f = document.createElement("iframe");
  f.width = c.w; f.height = c.h;
  f.src = "http://localhost:4173/#" + c.route;
  f.dataset.idx = idx;
  f.onload = () => {
    setTimeout(() => {
      try {
        const d = f.contentDocument, w = f.contentWindow;
        // Kill motion before measuring. The shell animates its grid columns, and
        // headless virtual time does not advance the transition clock, so
        // without this the probe reads a mid-flight 0px sleeve.
        const still = d.createElement("style");
        still.textContent = "*,*::before,*::after{transition:none !important;animation:none !important}";
        d.head.appendChild(still);
        if (c.route.startsWith("/search")) {
          const inp = d.querySelector("#searchInput");
          if (inp) { inp.value = "nova"; inp.dispatchEvent(new w.Event("input", { bubbles: true })); }
        }
        const vis = (el) => { if (!el) return false; const s = w.getComputedStyle(el); const r = el.getBoundingClientRect(); return s.display !== "none" && s.visibility !== "hidden" && r.width > 0 && r.height > 0; };
        const rect = (sel) => { const el = d.querySelector(sel); if (!el || !vis(el)) return null; const r = el.getBoundingClientRect(); return [Math.round(r.width), Math.round(r.height)]; };
        const gridCols = (sel) => { const el = d.querySelector(sel); return el ? w.getComputedStyle(el).gridTemplateColumns : null; };
        // Page-level overflow only. An element inside something that scrolls
        // (the filmstrip) or clips (the shell, which parks the closed queue
        // drawer off-canvas and crops the blurred hero cover) cannot overflow
        // the page, because an ancestor already constrains it.
        const constrained = (el) => {
          for (let n = el.parentElement; n && n !== d.body; n = n.parentElement) {
            const s = w.getComputedStyle(n);
            if ([s.overflowX, s.overflowY].some((v) => v !== "visible")) return true;
          }
          return false;
        };
        const overflow = [...d.querySelectorAll("body *")].filter(el => {
          if (constrained(el)) return false;
          const r = el.getBoundingClientRect();
          return r.width > 0 && (r.right > w.innerWidth + 1 || r.left < -1);
        }).slice(0, 5).map(el => el.tagName + "." + String(el.className).split(" ")[0]);
        out[idx] = {
          case: c,
          viewport: [w.innerWidth, w.innerHeight],
          docTitle: d.title,
          // shell
          spine: rect(".spine"),
          spineLabelsVertical: (() => { const el = d.querySelector(".spine .nav-label"); return el ? w.getComputedStyle(el).writingMode : null; })(),
          crate: rect(".crate"),
          libItems: d.querySelectorAll(".lib-item").length,
          libItemsVisible: [...d.querySelectorAll(".lib-item")].filter(vis).length,
          chipsVisible: vis(d.querySelector(".chips")),
          main: rect(".main"),
          sleeve: rect(".now-playing"),
          npOpen: d.querySelector("#app").classList.contains("np-open"),
          deck: rect(".player"),
          progressVisible: vis(d.querySelector(".progress-row")),
          volumeVisible: vis(d.querySelector(".volume")),
          mobileNav: vis(d.querySelector(".mobile-nav")),
          topbarPills: vis(d.querySelector(".pill-light")),
          bodyCols: gridCols(".body"),
          // editorial home
          heroVisible: vis(d.querySelector(".hero-sleeve")),
          heroTitle: (d.querySelector(".hero-title") || {}).textContent || null,
          chartRows: d.querySelectorAll(".chart-row").length,
          mosaicCols: gridCols(".mosaic-grid"),
          mosaicCards: d.querySelectorAll(".mosaic-grid .card").length,
          stripCards: d.querySelectorAll(".strip .card").length,
          siteFootLinks: d.querySelectorAll(".site-foot a").length,
          // structural regression checks
          gridCols: gridCols(".track-row"),
          rows: d.querySelectorAll(".track-row").length,
          songs: d.querySelectorAll(".song-row").length,
          nowPlayingTitle: (d.querySelector(".np-title") || {}).textContent || null,
          overflow
        };
      } catch (e) { out[idx] = { case: c, error: String(e) }; }
      if (++done === CASES.length) {
        window.__results = out;
        const pre = document.createElement("pre");
        pre.id = "out";
        pre.textContent = JSON.stringify(out, null, 1);
        document.body.appendChild(pre);
      }
    }, 900);
  };
  document.body.appendChild(f);
});
</script>
</body></html>
