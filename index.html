<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="vanimusic — a Spotify-style web player built with vanilla HTML, CSS and JavaScript." />
  <title>vanimusic — Web Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='23' fill='%231ed760'/%3E%3Cg fill='%23000'%3E%3Crect x='13' y='20' width='4' height='9' rx='2'/%3E%3Crect x='20' y='14' width='4' height='21' rx='2'/%3E%3Crect x='27' y='10' width='4' height='28' rx='2'/%3E%3Crect x='34' y='18' width='4' height='13' rx='2'/%3E%3C/g%3E%3C/svg%3E" />
</head>
<body>
  <div class="app" id="app">
    <!-- ── Top bar ─────────────────────────────────────────────── -->
    <header class="topbar">
      <a class="brand" href="#/" data-nav="/" aria-label="vanimusic home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="23" fill="currentColor" />
            <g fill="#000">
              <rect x="13" y="20" width="4" height="9" rx="2" />
              <rect x="20" y="14" width="4" height="21" rx="2" />
              <rect x="27" y="10" width="4" height="28" rx="2" />
              <rect x="34" y="18" width="4" height="13" rx="2" />
            </g>
          </svg>
        </span>
        <span class="brand-name">vanimusic</span>
      </a>

      <div class="history">
        <button class="icon-btn round" id="backBtn" type="button" aria-label="Go back" title="Go back">
          <i data-icon="chevron-left" data-size="sm"></i>
        </button>
        <button class="icon-btn round" id="forwardBtn" type="button" aria-label="Go forward" title="Go forward">
          <i data-icon="chevron-right" data-size="sm"></i>
        </button>
      </div>

      <form class="search" id="searchForm" role="search" autocomplete="off">
        <i class="search-icon" data-icon="search" data-size="sm"></i>
        <input class="search-input" id="searchInput" type="text" placeholder="What do you want to play?" aria-label="Search" spellcheck="false" />
        <span class="search-sep" aria-hidden="true"></span>
        <button class="search-browse" id="browseBtn" type="button" aria-label="Browse" title="Browse">
          <i data-icon="music" data-size="sm"></i>
        </button>
      </form>

      <div class="topbar-actions">
        <a class="pill pill-text admin-pill" href="admin.html" title="Open the admin panel"><i data-icon="plus" data-size="sm"></i><span>Admin</span></a>
        <button class="pill pill-light" id="authBtn" type="button">Log in</button>
        <button class="pill pill-light" type="button" data-action="toast" data-msg="Premium checkout isn't part of this demo">Explore Premium</button>
        <button class="pill pill-text" type="button" data-action="toast" data-msg="Install prompt isn't part of this demo">
          <i data-icon="download" data-size="sm"></i><span>Install App</span>
        </button>
        <button class="icon-btn round" type="button" aria-label="What's new" data-action="toast" data-msg="No new notifications">
          <i data-icon="bell" data-size="sm"></i>
        </button>
        <button class="avatar" id="avatarBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Account menu" hidden>B</button>
        <div class="menu" id="accountMenu" role="menu" hidden>
          <div class="menu-user">
            <strong id="accountName"></strong>
            <span id="accountEmail"></span>
          </div>
          <div class="menu-sep"></div>
          <button type="button" role="menuitem" data-action="open-profile">Profile</button>
          <button type="button" role="menuitem" data-action="create-playlist">Create playlist</button>
          <div class="menu-sep"></div>
          <button type="button" role="menuitem" data-action="logout">Log out</button>
        </div>
      </div>
    </header>

    <!-- ── Workspace ───────────────────────────────────────────── -->
    <div class="body" id="body">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <nav class="panel nav-panel" aria-label="Main">
          <a class="nav-link active" href="#/" data-nav="/" title="Home">
            <i data-icon="home"></i><span class="nav-label">Home</span>
          </a>
          <a class="nav-link" href="#/search" data-nav="/search" title="Search">
            <i data-icon="search"></i><span class="nav-label">Search</span>
          </a>
        </nav>

        <section class="panel library-panel" aria-label="Your Library">
          <div class="lib-head">
            <button class="lib-title" type="button" data-nav="/library" title="Your Library">
              <i data-icon="library"></i><span>Your Library</span>
            </button>
            <div class="lib-head-actions">
              <button class="icon-btn round" type="button" aria-label="Create playlist" title="Create playlist" data-action="create-playlist">
                <i data-icon="plus" data-size="sm"></i>
              </button>
              <button class="icon-btn round" type="button" aria-label="Expand library" title="Expand library" data-action="toast" data-msg="Library layout is already expanded">
                <i data-icon="arrow-right" data-size="sm"></i>
              </button>
            </div>
          </div>

          <div class="chips" id="libChips" role="tablist" aria-label="Library filters">
            <button class="chip active" type="button" role="tab" aria-selected="true" data-filter="playlists">Playlists</button>
            <button class="chip" type="button" role="tab" aria-selected="false" data-filter="albums">Albums</button>
            <button class="chip" type="button" role="tab" aria-selected="false" data-filter="artists">Artists</button>
          </div>

          <div class="lib-list" id="libList"></div>

          <div class="lib-footer">
            <div class="lib-links">
              <a href="#/library" data-nav="/library">Legal</a>
              <a href="#/library" data-nav="/library">Privacy Center</a>
              <a href="#/library" data-nav="/library">Privacy Policy</a>
              <a href="#/library" data-nav="/library">Cookies</a>
              <a href="#/library" data-nav="/library">About Ads</a>
            </div>
            <button class="lang-btn" type="button" data-action="toast" data-msg="Language picker isn't part of this demo">
              <i data-icon="globe" data-size="sm"></i> English
            </button>
          </div>
        </section>
      </aside>

      <!-- Main view -->
      <main class="main" id="main">
        <div class="main-scroll" id="mainScroll">
          <div class="view" id="view"></div>
        </div>
      </main>

      <!-- Now playing panel -->
      <aside class="panel now-playing" id="nowPlaying" aria-label="Now playing">
        <div class="np-top">
          <span>Now playing</span>
          <div class="np-top-actions">
            <button class="icon-btn round small" type="button" id="npQueueBtn" aria-label="Open queue" title="Queue">
              <i data-icon="queue" data-size="sm"></i>
            </button>
            <button class="icon-btn round small" type="button" id="npClose" aria-label="Close now playing view" title="Close">
              <i data-icon="x" data-size="sm"></i>
            </button>
          </div>
        </div>
        <div class="np-scroll" id="npBody"></div>
      </aside>

      <!-- Queue drawer -->
      <aside class="queue-drawer" id="queueDrawer" aria-label="Queue" aria-hidden="true">
        <div class="queue-head">
          <h2>Queue</h2>
          <button class="icon-btn round small" type="button" id="queueClose" aria-label="Close queue">
            <i data-icon="x" data-size="sm"></i>
          </button>
        </div>
        <div class="queue-scroll" id="queueList"></div>
      </aside>
    </div>

    <!-- Mobile nav -->
    <nav class="mobile-nav" aria-label="Mobile">
      <a href="#/" data-nav="/" class="mobile-nav-item active">
        <i data-icon="home"></i><span>Home</span>
      </a>
      <a href="#/search" data-nav="/search" class="mobile-nav-item">
        <i data-icon="search"></i><span>Search</span>
      </a>
      <a href="#/library" data-nav="/library" class="mobile-nav-item">
        <i data-icon="library"></i><span>Library</span>
      </a>
    </nav>

    <!-- ── Player ──────────────────────────────────────────────── -->
    <footer class="player" aria-label="Player">
      <div class="player-left">
        <img class="bar-art" id="barArt" alt="" />
        <div class="bar-meta">
          <div class="bar-title" id="barTitle">—</div>
          <div class="bar-artist" id="barArtist"></div>
        </div>
        <button class="icon-btn round small like-btn" id="barLike" type="button" aria-label="Save to Liked Songs" title="Save to Liked Songs">
          <i data-icon="heart" data-size="sm"></i>
        </button>
      </div>

      <div class="player-center">
        <div class="controls">
          <button class="ctrl" id="shuffleBtn" type="button" aria-label="Enable shuffle" title="Enable shuffle">
            <i data-icon="shuffle" data-size="sm"></i>
          </button>
          <button class="ctrl" id="prevBtn" type="button" aria-label="Previous" title="Previous">
            <i data-icon="prev"></i>
          </button>
          <button class="play-btn" id="playBtn" type="button" aria-label="Play" title="Play">
            <i data-icon="play"></i>
          </button>
          <button class="ctrl" id="nextBtn" type="button" aria-label="Next" title="Next">
            <i data-icon="next"></i>
          </button>
          <button class="ctrl" id="repeatBtn" type="button" aria-label="Enable repeat" title="Enable repeat">
            <i data-icon="repeat" data-size="sm"></i>
          </button>
        </div>

        <div class="progress-row">
          <span class="time" id="curTime">0:00</span>
          <div class="bar" id="progressBar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="bar-fill" id="progressFill"></div>
            <div class="bar-knob" id="progressKnob"></div>
          </div>
          <span class="time" id="durTime">0:00</span>
        </div>
      </div>

      <div class="player-right">
        <button class="icon-btn round small" type="button" id="lyricsBtn" aria-label="Lyrics" title="Lyrics">
          <i data-icon="mic" data-size="sm"></i>
        </button>
        <button class="icon-btn round small" type="button" id="queueBtn" aria-label="Queue" title="Queue">
          <i data-icon="queue" data-size="sm"></i>
        </button>
        <button class="icon-btn round small" type="button" aria-label="Connect to a device" title="Connect to a device" data-action="toast" data-msg="No devices found on this network">
          <i data-icon="devices" data-size="sm"></i>
        </button>
        <div class="volume">
          <button class="icon-btn round small" id="muteBtn" type="button" aria-label="Mute" title="Mute">
            <i data-icon="volume" data-size="sm"></i>
          </button>
          <div class="bar" id="volumeBar" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="65">
            <div class="bar-fill" id="volumeFill"></div>
            <div class="bar-knob" id="volumeKnob"></div>
          </div>
        </div>
        <button class="icon-btn round small" type="button" id="npToggle" aria-label="Now playing view" title="Now playing view" aria-pressed="false">
          <i data-icon="panel" data-size="sm"></i>
        </button>
        <button class="icon-btn round small" type="button" id="fullscreenBtn" aria-label="Full screen" title="Full screen">
          <i data-icon="fullscreen" data-size="sm"></i>
        </button>
      </div>
    </footer>

    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  </div>

  <!-- Account modal -->
  <div class="modal" id="authModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <button class="modal-close" id="authClose" type="button" aria-label="Close">✕</button>
      <h2 class="auth-title" id="authTitle">Log in to vanimusic</h2>
      <p class="auth-sub">Apni playlists banao aur liked songs apne account me save karo.</p>

      <button class="auth-google" id="authGoogle" type="button">
        <span class="google-mark" aria-hidden="true">G</span>
        Continue with Google
      </button>

      <button class="auth-google auth-facebook" id="authFacebook" type="button">
        <span class="facebook-mark" aria-hidden="true">f</span>
        Continue with Facebook
      </button>

      <div class="auth-or" id="authOr"><span>or</span></div>
      <p class="auth-note" id="authNote" hidden></p>

      <form id="authForm">
        <label class="auth-label" for="authEmail">Email</label>
        <input type="email" id="authEmail" required autocomplete="email" placeholder="you@example.com" />
        <label class="auth-label" for="authPassword">Password</label>
        <input type="password" id="authPassword" required minlength="6" autocomplete="current-password" placeholder="••••••••" />
        <button class="auth-submit" id="authSubmit" type="submit">Log in</button>
      </form>

      <p class="auth-switch">
        <span id="authSwitchText">New here?</span>
        <button type="button" id="authSwitch">Create an account</button>
      </p>
      <p class="auth-msg" id="authMsg"></p>
    </div>
  </div>

  <!-- Create playlist modal -->
  <div class="modal" id="playlistModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="playlistTitle">
      <button class="modal-close" id="playlistClose" type="button" aria-label="Close">✕</button>
      <h2 class="auth-title" id="playlistTitle">Create playlist</h2>
      <form id="playlistForm">
        <label class="auth-label" for="playlistName">Playlist name</label>
        <input type="text" id="playlistName" required maxlength="60" placeholder="My playlist" />
        <button class="auth-submit" id="playlistSubmit" type="submit">Create</button>
      </form>
      <p class="auth-msg" id="playlistMsg"></p>
    </div>
  </div>

  <!-- Add to playlist modal -->
  <div class="modal" id="addModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="addTitle">
      <button class="modal-close" id="addClose" type="button" aria-label="Close">✕</button>
      <h2 class="auth-title" id="addTitle">Add to playlist</h2>
      <div class="add-list" id="addList"></div>
      <p class="auth-msg" id="addMsg"></p>
    </div>
  </div>

  <script src="js/synth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/supabase-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
